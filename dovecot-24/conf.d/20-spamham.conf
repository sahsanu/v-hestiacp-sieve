# Spam-Ham autolearn for HestiaCP (Dovecot 2.4 syntax)

mail_attribute {
  dict attribs {
    driver = file
    dict_file_path = ~/dovecot-attributes
  }
}

imapsieve_url = sieve://127.0.0.1:4190

# From elsewhere into Spam -> report as spam.
# Re-opening "namespace inbox" here merges into HestiaCP's own 15-mailboxes.conf
# (Dovecot 2.4 merges named filters), so that Hestia-managed file stays untouched.
namespace inbox {
  mailbox Spam {
    sieve_script report_spam {
      type  = before
      cause = copy append
      path  = /var/mail/sieve/report_spam.sieve
    }
  }
}

# From Spam to elsewhere -> report as ham
imapsieve_from Spam {
  sieve_script report_ham {
    type  = before
    cause = copy
    path  = /var/mail/sieve/report_ham.sieve
  }
}
